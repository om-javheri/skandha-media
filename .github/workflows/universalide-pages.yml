# Written by UniversalIDE on every deploy: builds this next project and publishes it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [universalide]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy replaces one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
